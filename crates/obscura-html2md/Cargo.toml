[package]
name = "obscura-html2md"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Read-only DOM to Markdown conversion with an iterative state machine (ported from moli-html2md)"

[dependencies]
icu_properties = { version = "2.2", default-features = false, features = ["compiled_data"] }

[dev-dependencies]
html5ever = { workspace = true }
markup5ever_rcdom = "0.39"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = "1"
