[package]
name = "obscura-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
stealth = ["wreq", "wreq-util"]

[dependencies]
obscura-ssrf = { workspace = true }
reqwest = { workspace = true }
# Keep embedded consumers above the vulnerable transitive zstd requirements.
compression-codecs = { version = "0.4.46", default-features = false }
tokio = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
encoding_rs = "0.8"
tempfile = "3"
psl = "2"
futures-util = "0.3"
base64 = { workspace = true }
# Browser-profile cookie import (cookie_import.rs). rusqlite is bundled so no
# system SQLite is needed; the RustCrypto crates cover Chrome's v10/v11
# AES-GCM values and the AES-128-CBC key wrap in Local State.
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sha2 = "0.10"
# Page-side WebSocket transport (websocket.rs): tungstenite frame codec over
# tokio-rustls (webpki roots, same family as reqwest's rustls-tls) plus HTTP
# CONNECT and SOCKS5 proxy hops.
tokio-tungstenite = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
tokio-socks = "0.5"
# wreq and wreq-util are pre-release crates whose API changes between rc builds
# (CertStore moved out of `tls`, `cert_store` renamed to `tls_cert_store`, the
# Emulation builder reshuffled). A caret requirement let a fresh resolve pull a
# newer, incompatible rc and broke `cargo build --features stealth` (issue #234).
# Pin exact versions so the build always resolves to the API wreq_client.rs targets.
wreq-util = { path = "../../vendor/wreq-util", version = "=3.0.0-rc.12", optional = true, features = ["emulation-compression"] }

[dev-dependencies]
socket2 = "0.6"
# TLS fixtures for the configured-roots tests: rcgen mints a throwaway CA + leaf,
# tokio-rustls serves one HTTPS response with them. Pinned to the ring
# provider so the test binary has a single rustls CryptoProvider (reqwest's
# rustls also uses ring; adding aws-lc-rs would make provider auto-selection
# panic).
rcgen = "0.13"

# `prefix-symbols` renames BoringSSL exports to avoid clashes with system OpenSSL,
# but the renaming is only correct on Linux and Android (per wreq's README).
# Enabling it on other platforms produces unresolved `build_script_main_*`
# symbols at link time (see issue #39).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wreq = { version = "=6.0.0-rc.29", optional = true, features = ["prefix-symbols", "socks", "stream", "gzip", "brotli", "deflate", "zstd"] }

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
wreq = { version = "=6.0.0-rc.29", optional = true, features = ["socks", "stream", "gzip", "brotli", "deflate", "zstd"] }
